<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="electricGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes floatGrid {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseBeam {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.9; stroke-dashoffset: -40; }
      }
      @keyframes energyFlow {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes spinGlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .animated-grid { animation: floatGrid 6s ease-in-out infinite; }
      .pulsing-path { stroke-dasharray: 20 10; animation: pulseBeam 4s linear infinite; }
      .energy-line { stroke-dasharray: 10 5; animation: energyFlow 2s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Grid Tech Lines -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="1" class="animated-grid">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1050" y1="0" x2="1050" y2="300" />
  </g>

  <!-- Dynamic Circuit / Energy Waves -->
  <path d="M-50 220 Q 200 120, 450 220 T 950 180 T 1250 240" fill="none" stroke="url(#electricGrad)" stroke-width="3" opacity="0.4" class="pulsing-path" filter="url(#lightGlow)" />
  <path d="M-50 80 Q 300 240, 650 100 T 1250 140" fill="none" stroke="#00e676" stroke-width="2" opacity="0.3" class="energy-line" />

  <!-- EV Charging & Fleet Icon Graphics (Right Side) -->
  <g transform="translate(920, 70)" filter="url(#glow)">
    <!-- Outer Glowing Charging Station Circle -->
    <circle cx="100" cy="80" r="75" fill="#0d233a" stroke="url(#electricGrad)" stroke-width="3" opacity="0.9" />
    
    <!-- Lightning Bolt Icon -->
    <path d="M105 35 L75 85 H100 L95 125 L130 75 H105 Z" fill="url(#electricGrad)" />

    <!-- Fleet Vehicle Silhouettes -->
    <!-- Truck 1 -->
    <rect x="-40" y="110" width="55" height="28" rx="4" fill="#00f2fe" opacity="0.8" />
    <path d="M15 118 L27 118 L33 126 L33 138 L15 138 Z" fill="#00f2fe" opacity="0.8" />
    <circle cx="-20" cy="140" r="6" fill="#0a0f1d" stroke="#00f2fe" stroke-width="2" />
    <circle cx="22" cy="140" r="6" fill="#0a0f1d" stroke="#00f2fe" stroke-width="2" />

    <!-- Bus 2 -->
    <rect x="-120" y="70" width="70" height="32" rx="6" fill="#00e676" opacity="0.85" />
    <rect x="-112" y="76" width="12" height="10" rx="2" fill="#0a0f1d" />
    <rect x="-96" y="76" width="12" height="10" rx="2" fill="#0a0f1d" />
    <rect x="-80" y="76" width="12" height="10" rx="2" fill="#0a0f1d" />
    <circle cx="-100" cy="104" r="6" fill="#0a0f1d" stroke="#00e676" stroke-width="2" />
    <circle cx="-64" cy="104" r="6" fill="#0a0f1d" stroke="#00e676" stroke-width="2" />
  </g>

  <!-- Header Text Section -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <g transform="translate(0, -50)">
      <rect width="240" height="30" rx="15" fill="#1e3a5f" stroke="#00f2fe" stroke-width="1.5" opacity="0.9" />
      <text x="120" y="19" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ ELECTRIC MOBILITY &amp; FLEET</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Fleet Electrification
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
      Curated platforms, OCPP charge management, depot optimization &amp; EV telematics
    </text>

    <!-- Feature Highlights -->
    <g transform="translate(0, 95)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#00e676">
      <text x="0" y="0">🔌 OCPP 2.0.1 / CSMS</text>
      <text x="170" y="0">🔋 Battery Telemetry</text>
      <text x="340" y="0">🚌 Transit &amp; Depot Smart Charging</text>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="294" width="1200" height="6" fill="url(#electricGrad)" />
</svg>
